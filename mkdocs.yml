site_name: vLLM-Omni Kanban
site_description: Daily multimodal CI health dashboard for vLLM-omni
# site_url is required for correct canonical URLs, sitemap entries, and to
# ensure Material generates project-prefixed links (e.g. /vllm-omni-kanban/...)
# rather than host-absolute ones (/...).
site_url: https://hsliuustc0106.github.io/vllm-omni-kanban/
theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.expand
  palette:
    - scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
hooks:
  - scripts/mkdocs_hooks.py
plugins:
  - search
markdown_extensions:
  - md_in_html
nav:
  - Home: index.md
  - Models:
      - Qwen3 Omni: models/qwen3-omni.md
      - Qwen3 TTS: models/qwen3-tts.md
      - Qwen Image: models/qwen-image.md
      - Qwen Image Layered: models/qwen-image-layered.md
      - Qwen Image Edit: models/qwen-image-edit.md
      - Qwen Image Edit 2511: models/qwen-image-edit-2511.md
      - WAN 2.2: models/wan22.md
      - Hunyuan Image 3: models/hunyuan-image3.md
      - BAGEL: models/bagel.md
      - VoxCPM2: models/voxcpm2.md
  - Alerts: alerts.md
  # Individual report pages are intentionally not listed: docs/reports/index.md is
  # regenerated at build time (see scripts/mkdocs_hooks.py) and links every report,
  # so external repos can drop in YYYY-MM-DD.md files without touching this nav.
  - Reports:
      - Test Report: reports/nightly-test-report.md
      - Archive: reports/index.md
extra_javascript:
  - https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js
  - assets/js/render_charts.js
  - assets/js/render_nightly_report.js
extra_css:
  - assets/stylesheets/dashboard.css
